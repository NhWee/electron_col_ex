name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      # The real-data script, the toy MC (seeded) and the extensions are
      # deterministic and should reproduce the README numbers. The pull study
      # runs 20 toys as a smoke test; the README's 500 take ~5 minutes.
      # MadGraph5 is not available in CI.
      - run: python src/compute_cross_section.py
      - run: python src/simulate_mumu.py
      - run: python src/extended_fits.py
      - run: python src/pull_study.py --n-toys 20
